[project]
name = "azerbaijan-mcp-workspace"
version = "0.0.0"
description = "Workspace root of the azerbaijan-mcp monorepo. Not published."
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The dotless i is an ordinary Azerbaijani letter, not a typo.
allowed-confusables = ["ı"]

[tool.ruff.lint.isort]
known-first-party = ["azerbaijan_mcp_*"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = "-ra --import-mode=importlib -m 'not live'"
markers = ["live: calls the real upstream service; run with `pytest -m live`"]
